# Token-level ViT world model — Option C baseline (64x64 data).
#
# Selects TokenViTTransition + TokenViTEncoder instead of RSSM + ConvEncoder.
# All planning, EFE, and GMM code paths remain unchanged; the world model
# exposes the same RSSM-compatible interface.
#
# Key differences from default.yaml:
# - model.world_model_type: token_vit
# - token_vit: full architecture parameters
# - encoder.state_dim: 4  (same as default)
# - rssm fields retained for ensemble/preference instantiation fallbacks

seed: 42
device: cuda

model:
  world_model_type: token_vit

encoder:
  image_channels: 3
  image_size: 64
  state_dim: 4
  crop_road: true

token_vit:
  image_size: 64
  patch_size: 8
  num_tokens: 64
  use_action_warp: false      # A1: spatial warp of token grid by action flow
  embed_dim: 256
  deter_dim: 256
  stoch_dim: 64
  feat_dim: 320
  num_layers: 4
  num_prior_layers: 2
  num_post_layers: 2
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  min_std: 0.1
  action_dim: 2

# Keep rssm block so preference/ensemble fall back to correct stoch_dim.
rssm:
  deter_dim: 256
  stoch_dim: 64
  embed_dim: 256
  min_std: 0.1

ensemble:
  num_heads: 5
  hidden_dim: 256

cem:
  horizon: 12
  n_samples: 500
  n_elites: 50
  n_iters: 5
  colored_noise_beta: 1.0
  warm_start: true
  action_dim: 2
  noise_scale: [0.8, 0.6]
  accel_prior: 0.3
  cold_start_extra_iters: 5
  min_std: 0.1
  keep_fraction: 0.2

preference:
  K: 5
  min_std: 0.01
  update_interval: 1
  warmup_epoch: 10
  fit_iters: 300
  fit_lr: 0.005
  max_samples: 5000
  token_wise: false   # A2: use token-wise contrastive preference in EFE
  topk: 8             # A2: top-k token score aggregation

efe:
  beta_instrumental: 1.0
  beta_epistemic: 0.1
  beta_state: 0.5
  mc_samples: 32
  temporal_discount: 0.95

training:
  epochs: 50
  batch_size: 64
  seq_len: 50
  lr: 1.0e-4
  grad_clip: 100.0
  kl_dyn_scale: 1.0
  kl_rep_scale: 0.5
  free_nats: 1.0
  overshoot_horizon: 0      # baseline: 1-step KL only; override with --set to enable
  overshoot_weight: 0.0
  token_kl_weighting: "none"    # A3: "none"|"error"
  warp_smoothness_weight: 0.0   # A1: flow TV regularization
  rollout_recon_horizon: 0          # multi-step pixel rollout recon; 0=off
  rollout_recon_weight: 0.0         # weight for rollout recon loss
  rollout_recon_warmup_steps: 0     # linear rollout_recon warmup; 0=off
  rollout_recon_obstacle_weight: 1.0  # obstacle bbox pixel upweight (1=uniform)
  rollout_recon_step_decay: 0.0     # per-step weight decay; 0=uniform
  img_recon_obstacle_weight: 1.0    # 1-step img recon obstacle upweight (1=uniform)
  stage: "joint"             # joint | ae | transition (two-stage training)
  ae_kl_rep: 0.01            # stage-ae weak posterior KL; 0=pure AE
  ae_train_rssm: true        # stage-ae trains encoder + RSSM/TokenViT latent path + decoders
  warmup_steps: 0           # LR warmup steps (0=off) -> cosine decay
  min_lr_ratio: 0.0333      # cosine floor (~1/30 of peak lr)
  cycle_weight: 0.0         # transition: prior-mean vs posterior-mean L2
  cycle_horizon: 5          # rollout steps cycle loss spans (indep. of overshoot)
  cycle_warmup_steps: 5000  # linear cycle_weight warmup; 0=off
  obstacle_token_weight: 1.0  # ViT: upweight obstacle-overlap tokens in cycle loss (1=off)
  rollout_single_shot: false  # PAActInf-style: rollout rr/cycle once per sequence
  rollout_context_frames: 25  # P: single-shot rollout start frame
  transition_loss_mode: "target_rollout"  # "target_rollout" | "dense_one_step"
  transition_use_target_model: true
  lambda_kl: 1.0
  lambda_pix: 25.0
  lambda_deter: 1.0
  lambda_stoch_mean: 0.0
  lambda_stoch_decode: 0.0
  rollout_horizon: 1
  rollout_decode_horizons: [1]
  rollout_decode_deterministic: true
  rollout_pix_warmup_steps: 2000
  target_rollout_step_decay: 1.0
  target_rollout_future_warmup_steps: 0
  target_rollout_detach_between_steps: false
  h1_anchor_checkpoint: null
  h1_anchor_weight: 0.0
  h1_anchor_stoch_weight: 1.0
  h1_anchor_deter_weight: 1.0
  h1_anchor_decode_weight: 1.0
  free_nats_transition: 0.5
  transition_use_raw_kl_loss: true
  posterior_anchor_weight: 0.0
  posterior_anchor_horizons: [0, 1, 3]
  diag_use_target_recon: false
  bbox_pix_weight: 0.0
  bbox_deter_weight: 0.0
  bbox_mask_dilate: 0
  bbox_min_area: 1.0
  bbox_weight_mode: "additive"
  bbox_coord_space: "raw"

evaluation:
  episodes: 5
  max_frames: 1000
  epistemic_anneal: 0.1
  towns:
    task_a: Town04
    task_b: Town06_Opt
    baseline: Town06
