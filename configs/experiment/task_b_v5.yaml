# Task B v5: Obstacle Avoidance via Runtime EFE Penalty (4D model)
#
# Uses the proven 4D world model (no weight surgery) with runtime
# obstacle-aware EFE penalty. When obstacle is detected ahead,
# penalizes CEM trajectories where decoded crosstrack doesn't shift
# (staying in collision lane).
#
# Key differences from default.yaml:
# - beta_obstacle: 3.0 (runtime lane-change penalty strength)
# - beta_state: 0.0 (allow crosstrack deviation during lane change)
# - heading_only_state: true (backup if beta_state > 0)
# - horizon: 15 (longer planning for lane-change commitment)
# - noise_scale: [1.0, 0.6] (wider steer exploration)
# - K: 7 (more GMM components for lane-change preference)
# - accel_prior: 0.2 (slower approach to obstacles)

seed: 42
device: cuda

training:
  batch_size: 64

encoder:
  image_channels: 3
  image_size: 64
  state_dim: 4
  crop_road: true

rssm:
  deter_dim: 256
  stoch_dim: 64
  embed_dim: 256
  min_std: 0.1

cem:
  horizon: 15
  n_samples: 500
  n_elites: 50
  n_iters: 5
  colored_noise_beta: 1.0
  warm_start: true
  action_dim: 2
  noise_scale: [1.0, 0.6]
  accel_prior: 0.2
  cold_start_extra_iters: 5
  min_std: 0.1
  keep_fraction: 0.2
  warm_start_reset_threshold: 4.0

preference:
  K: 7
  min_std: 0.01
  update_interval: 1
  warmup_epoch: 10
  fit_iters: 300
  fit_lr: 0.005
  max_samples: 5000

efe:
  beta_instrumental: 1.0
  beta_epistemic: 0.1
  beta_state: 0.0
  beta_obstacle: 40.0
  mc_samples: 32
  temporal_discount: 0.95
  heading_only_state: true

evaluation:
  towns:
    task_b: Town06_Opt
