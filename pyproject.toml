[project]
name = "active-inference"
version = "0.1.0"
description = "Deep Active Inference agent for autonomous driving in CARLA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "h5py>=3.11.0",
    "opencv-python>=4.10.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0.0",
    "tensorboard>=2.18.0",
    "wandb>=0.18.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "einops>=0.8.0",
    "pillow>=10.4.0",
    "imageio[ffmpeg]>=2.34.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
carla = [
    "carla==0.9.16",
]
ui = [
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "matplotlib>=3.9.0",
]

[project.scripts]
train = "active_inference.scripts.train:main"
collect = "active_inference.scripts.collect_data:main"
evaluate = "active_inference.scripts.evaluate:main"

[tool.uv]
torch-backend = "cu118"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/active_inference"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires a running CARLA server",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
